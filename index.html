<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1712" />
    <meta name="description" content="Portfolio of Chrislyr John P. Tan, a Computer Science student and software developer building tested mobile, web, and automated scheduling systems." />
    <meta property="og:title" content="choonhows." />
    <meta property="og:description" content="Computer Science student building tested mobile, web, and automated scheduling systems." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #0b1712; }
      body { min-width: 320px; }
      #root { opacity: 0; }
      html.site-ready #root { opacity: 1; transition: opacity 480ms cubic-bezier(.16, 1, .3, 1); }

      .skip-link {
        position: fixed;
        z-index: 10001;
        top: 1rem;
        left: 1rem;
        padding: .75rem 1rem;
        color: #102018;
        background: #add66f;
        font: 600 .75rem/1 system-ui, sans-serif;
        text-decoration: none;
        transform: translateY(-180%);
      }
      .skip-link:focus { transform: translateY(0); }

      #site-loader {
        position: fixed;
        z-index: 10000;
        inset: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        color: #f2efe4;
        background: #0b1712;
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms cubic-bezier(.7, 0, .84, 0), visibility 0s linear 420ms;
      }

      .site-loader__frame {
        width: min(calc(100% - 48px), 560px);
        transition: transform 420ms cubic-bezier(.7, 0, .84, 0), filter 420ms cubic-bezier(.7, 0, .84, 0);
      }

      .site-loader__meta {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        color: #96a49b;
        font: 500 10px/1.2 Poppins, system-ui, sans-serif;
        letter-spacing: .14em;
      }

      .site-loader__meta span:first-child { color: #add66f; }
      .site-loader__title {
        margin: clamp(28px, 7vh, 62px) 0 clamp(24px, 6vh, 48px);
        font: 700 clamp(46px, 11vw, 84px)/.88 Poppins, system-ui, sans-serif;
        letter-spacing: -.055em;
      }

      .site-loader__title span { display: block; }
      .site-loader__title span:last-child { color: #1c3228; }
      .site-loader__flow { width: 100%; height: 54px; display: block; }
      .site-loader__rail,
      .site-loader__trace { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .site-loader__rail { stroke: #1c3228; }
      .site-loader__trace {
        stroke: #add66f;
        stroke-linecap: round;
        stroke-dasharray: .2 .8;
        animation: loader-flow 1.25s linear infinite;
      }

      .site-loader__dot { fill: #d8c7a7; }
      .site-loader__status {
        margin: 17px 0 0;
        color: #96a49b;
        font: 500 11px/1.4 Poppins, system-ui, sans-serif;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      html.site-ready #site-loader { opacity: 0; visibility: hidden; pointer-events: none; }
      html.site-ready .site-loader__frame { filter: blur(3px); transform: translateY(-10px); }

      @keyframes loader-flow { to { stroke-dashoffset: -1; } }

      @media (max-width: 600px) {
        .site-loader__frame { width: calc(100% - 40px); }
        .site-loader__meta { font-size: 9px; }
        .site-loader__title { margin-block: 34px 28px; font-size: clamp(44px, 17vw, 62px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #root, html.site-ready #root, #site-loader, .site-loader__frame { transition: none; }
        .site-loader__trace { animation: none; stroke-dasharray: 1 0; }
      }
    </style>
    <title>choonhows.</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-loader" role="status" aria-live="polite" aria-label="Loading Chrislyr's portfolio">
      <div class="site-loader__frame">
        <div class="site-loader__meta" aria-hidden="true">
          <span>ChoonHow / PORTFOLIO</span>
          <span>CEBU CITY / 2026</span>
        </div>
        <div class="site-loader__title" aria-hidden="true">
          <span>LOADING</span>
          <span>PORTFOLIO</span>
        </div>
        <svg class="site-loader__flow" viewBox="0 0 560 54" preserveAspectRatio="none" aria-hidden="true">
          <path class="site-loader__rail" pathLength="1" d="M1 31 C73 3 118 50 188 26 S301 8 363 30 S469 48 559 16" />
          <path class="site-loader__trace" pathLength="1" d="M1 31 C73 3 118 50 188 26 S301 8 363 30 S469 48 559 16" />
          <circle class="site-loader__dot" cx="559" cy="16" r="4" />
        </svg>
        <p class="site-loader__status">Preparing selected work</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(() => {
        document.documentElement.classList.add('site-ready')
        const loader = document.getElementById('site-loader')
        loader?.setAttribute('aria-hidden', 'true')
        window.setTimeout(() => loader?.remove(), 450)
      }, 3000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
